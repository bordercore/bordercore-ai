# Provider sections define the model picker order. Keep model IDs as top-level keys.
# vendor selects the API client; provider identifies the model maker.
# Models are roughly strongest first within each provider for general-purpose use.
# This is a manual capability ranking, not a speed/cost or task-specific ranking.
# OpenRouter Auto is a router rather than a fixed model, so it stays at the end.

# ── OpenAI ──────────────────────────────────────────
# Adjust base_url for your CLIProxy host. For direct OpenAI access, omit
# base_url, api_key, and served_by; configure settings.openai_api_key.
gpt-6-astra:
  name: GPT 6 Astra
  provider: OpenAI
  served_by: CLIProxy
  type: api
  vendor: openai
  base_url: http://localhost:8317/v1
  api_key: "not-needed"

